<script src="data/wiki.js"></script>
<script>
(function () {
  var W = window.WIKI;
  var list = document.getElementById('list');
  if (!W) { list.innerHTML = '<p class="empty">資料載入失敗，請重新整理頁面。</p>'; return; }
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
  var GROUPS = ['說話之島', '大陸野外', '地監'];
  var FILTERS = [['all', '全部']].concat(GROUPS.map(function (g) { return [g, g]; })).concat([['boss', '有 BOSS']]);
  var state = { f: 'all', q: '' };

  var chips = document.getElementById('chips');
  chips.innerHTML = FILTERS.map(function (f) { return '<button class="chip" data-f="' + f[0] + '">' + f[1] + '</button>'; }).join('');
  chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    state.f = b.dataset.f; render();
  });
  var q = document.getElementById('q');
  q.addEventListener('input', function () { state.q = q.value.trim(); render(); });

  function hasBoss(z) { return z.m.some(function (n) { return W.mobs[n] && W.mobs[n].boss; }); }

  function card(z) {
    var mobHit = state.q && z.n.indexOf(state.q) < 0;
    var tags = z.m.map(function (n) {
      var m = W.mobs[n];
      var cls = 'tag' + (m.boss ? ' boss' : '') + (mobHit && n.indexOf(state.q) >= 0 ? ' mark' : '');
      return '<a class="' + cls + '" href="monsters.html#m=' + encodeURIComponent(n) + '">' + esc(n) + ' <span class="lv">Lv' + esc(m.lvs) + '</span></a>';
    }).join('');
    return '<div class="dcard" id="z-' + esc(z.id) + '">' +
      '<h3>' + esc(z.n) + ' <span class="grp-badge">' + esc(z.g) + '</span>' + (hasBoss(z) ? ' <span class="boss-badge">BOSS</span>' : '') + '</h3>' +
      '<div class="meta">怪物等級 <b>' + (z.lo === z.hi ? z.lo : z.lo + '~' + z.hi) + '</b>・' + z.m.length + ' 種怪物</div>' +
      '<div class="tags">' + tags + '</div></div>';
  }

  function render() {
    chips.querySelectorAll('.chip').forEach(function (b) { b.classList.toggle('on', b.dataset.f === state.f); });
    var zs = W.zones.filter(function (z) {
      if (state.f === 'boss' ? !hasBoss(z) : (state.f !== 'all' && z.g !== state.f)) return false;
      if (!state.q) return true;
      return z.n.indexOf(state.q) >= 0 || z.m.some(function (n) { return n.indexOf(state.q) >= 0; });
    });
    document.getElementById('note').textContent = '找到 ' + zs.length + ' 個獵場' + (state.q ? '(含「' + state.q + '」)' : '');
    if (!zs.length) { list.innerHTML = '<p class="empty">找不到符合的獵場</p>'; return; }
    list.innerHTML = GROUPS.map(function (g) {
      var part = zs.filter(function (z) { return z.g === g; });
      if (!part.length) return '';
      return '<div class="group-hd">' + g + ' <small>' + part.length + ' 區</small></div><div class="cards">' + part.map(card).join('') + '</div>';
    }).join('');
  }

  document.getElementById('foot').innerHTML = '資料更新於 ' + esc(W.at) + '，只列目前開放的區域；之後開放新區域會再更新。<br>同一區的怪物依等級由低到高排列，點怪物名可以看牠的能力與掉落。';
  render();

  // 從怪物頁點「出沒地點」過來:#z=獵場代號 → 捲到那張卡並標亮
  function fromHash() {
    var m = location.hash.match(/^#z=(.+)$/);
    if (!m) return;
    state.f = 'all'; state.q = ''; q.value = ''; render();
    var el = document.getElementById('z-' + decodeURIComponent(m[1]));
    if (el) { el.classList.add('hit'); el.scrollIntoView({ block: 'center' }); }
  }
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
</body>
