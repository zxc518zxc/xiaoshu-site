<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小樹放置天堂|即將開服</title>
<meta name="description" content="小樹放置天堂即將開服。上線即時戰鬥，下線離線掛機，角色不停成長。">
<meta name="theme-color" content="#0f2a1d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='26' r='20' fill='%2346b16f'/%3E%3Crect x='28' y='40' width='8' height='18' rx='3' fill='%238a5a34'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #17241d;
    --ink-soft: #4f6357;
    --bg: #f3f7f2;
    --card: #ffffff;
    --line: #dde8de;
    --forest: #0f2a1d;
    --forest-2: #1d4630;
    --leaf: #46b16f;
    --leaf-soft: #e3f4e8;
    --sun: #f2c14e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.8;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }

  .hero {
    background:
      radial-gradient(circle at 18% 22%, rgba(242,193,78,.22), transparent 40%),
      radial-gradient(circle at 82% 12%, rgba(70,177,111,.30), transparent 45%),
      linear-gradient(165deg, var(--forest) 0%, var(--forest-2) 100%);
    color: #fff;
    padding: 80px 0 88px;
    text-align: center;
  }
  .tree { width: 96px; height: 96px; margin: 0 auto 18px; display: block; }
  .tag {
    display: inline-block; font-size: 14px; letter-spacing: .25em;
    color: var(--sun); border: 1px solid rgba(242,193,78,.55);
    padding: 2px 14px; border-radius: 999px; margin-bottom: 16px;
  }
  h1 { font-size: clamp(34px, 8vw, 56px); margin: 0 0 12px; letter-spacing: .1em; line-height: 1.25; }
  .lead { margin: 0 auto; max-width: 560px; color: #d3e6d9; font-size: 19px; }

  section { padding: 56px 0; }
  h2 { font-size: 26px; margin: 0 0 24px; letter-spacing: .08em; text-align: center; }

  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px 26px; box-shadow: 0 4px 18px rgba(15,42,29,.06);
  }
  .card .icon {
    width: 52px; height: 52px; border-radius: 14px; background: var(--leaf-soft);
    display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 6px; font-size: 21px; letter-spacing: .06em; }
  .card p { margin: 0; color: var(--ink-soft); }

  .notice {
    background: var(--card); border: 1px dashed var(--leaf); border-radius: 16px;
    padding: 28px 24px; text-align: center; max-width: 620px; margin: 0 auto;
  }
  .notice p { margin: 0; color: var(--ink-soft); }
  .notice strong { color: var(--ink); }

  footer { padding: 28px 0 40px; text-align: center; color: var(--ink-soft); font-size: 14px; border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <svg class="tree" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="26" r="20" fill="#46b16f"/>
      <circle cx="24" cy="20" r="7" fill="#6cc98e" opacity=".8"/>
      <rect x="28" y="40" width="8" height="18" rx="3" fill="#8a5a34"/>
    </svg>
    <div class="tag">即將開服</div>
    <h1>小樹放置天堂</h1>
    <p class="lead">上線即時戰鬥，下線離線掛機。<br>你休息的時候，角色也在長大。</p>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <h2>遊戲特色</h2>
      <div class="features">
        <div class="card">
          <div class="icon" aria-hidden="true">⚔️</div>
          <h3>即時戰鬥</h3>
          <p>上線時親自操作，與怪物即時交手，每一下攻擊都看得見。</p>
        </div>
        <div class="card">
          <div class="icon" aria-hidden="true">🌙</div>
          <h3>離線掛機</h3>
          <p>下線也不停，角色照樣打怪成長，回來直接收成。</p>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="notice">
        <p><strong>開服時間</strong>將於本站公告，敬請期待。</p>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">© 2026 小樹放置天堂</div>
</footer>

</body>
</html>
